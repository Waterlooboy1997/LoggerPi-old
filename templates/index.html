<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf" content="{{csrf}}"><title>Sites</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head><body>
<main class="site-page"><header class="toolbar"><h1>Sites</h1><input id="search" type="search" placeholder="Search sites" aria-label="Search sites"><label class="attention-filter"><input id="attention" type="checkbox"> Needs attention</label><button id="add">Add site</button><span id="scheduler" role="status">Checking scheduler</span><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{csrf}}"><button class="quiet">Sign out</button></form></header>
<p id="notice" role="status" hidden></p><section id="new-site" class="new-site" hidden><h2>Add site</h2><div class="editor-container"></div></section>
<table class="site-list"><thead><tr><th scope="col">Site</th><th scope="col">Status</th><th scope="col">Last success</th><th scope="col">Last record</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody id="sites"></tbody></table><p id="empty" hidden>No matching sites.</p></main>
<template id="site-editor"><form class="site-form"><div class="form-grid"><label>Site name<input name="name" required pattern="[A-Za-z0-9_-]+"></label><label>Hostname / IP<input name="host"></label><label>TCP port<input name="port" type="number" min="1" max="65535"></label><label>PakBus destination<input name="pakbus_address" type="number" min="0" max="4095"></label><label>Expected serial<input name="expected_serial"></label><label>Tables, comma separated<input name="tables" required></label><label class="check"><input type="checkbox" name="enabled"> Routine collection enabled</label></div>
<details class="advanced"><summary>Advanced settings</summary><div class="form-grid"><label>Logger model<input name="model"></label><label>Timezone<input name="timezone" required></label><label>Shared gateway<input name="gateway" placeholder="Blank uses host:port"></label><label>PakBus source<input name="pakbus_source" type="number" min="0" max="4095"></label><label>Physical destination<input name="pakbus_physical_address" type="number" min="0" max="4095"></label><label>Physical source<input name="pakbus_source_physical_address" type="number" min="0" max="4095"></label><label>Security code, blank keeps existing<input name="security_code" type="password" autocomplete="new-password" inputmode="numeric"></label><label class="check"><input type="checkbox" name="always_online"> Almost always online</label><label>Online from minute<input name="window_start" type="number" min="0" max="59"></label><label>Online until minute<input name="window_end" type="number" min="1" max="60"></label><label>Hourly attempts stop at minute<input name="hourly_attempt_window_minutes" type="number" min="1" max="60"></label><label>Retry spacing, seconds<input name="retry_interval_seconds" type="number" min="1"></label><label>Packet timeout, seconds<input name="timeout_seconds" type="number" min="1" max="60"></label><label>Attempt limit, seconds<input name="recent_budget_seconds" type="number" min="5" max="600"></label><label>Overlap, seconds<input name="overlap_seconds" type="number" min="0"></label><label>History records per hour<input name="backfill_record_limit" type="number" min="1"></label><label>History seconds per hour<input name="backfill_budget_seconds" type="number" min="0"></label><label>History job seconds<input name="backfill_slice_seconds" type="number" min="5"></label></div><button type="button" class="remove danger">Remove site</button></details><p class="form-error" role="alert" hidden></p><div class="form-actions"><button type="submit">Save settings</button><button type="button" class="cancel-edit">Cancel</button></div></form></template>
</body></html>
