<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="control-token" content="{{ control_token }}"><title>TCP Server Dashboard</title><link rel="stylesheet" href="/static/dashboard.css"></head><body><main><header><div><h1>TCP Server</h1><p>DietPi · Live port management</p></div><span id="connection">Connecting…</span></header><section id="summary" class="stats"></section><section class="stats" id="system"></section><div class="layout"><section class="panel"><div class="heading"><h2>TCP ports</h2><input id="search" type="search" placeholder="Filter port or IP"></div><div class="table-wrap"><table><thead><tr><th>Port</th><th>Listening</th><th>Clients</th><th>Client 1</th><th>Duration</th><th>Client 2</th><th>Duration</th><th>Rejects</th><th>Duplicates</th></tr></thead><tbody id="ports"></tbody></table></div></section><section class="panel"><h2 id="detail-title">Port details</h2><div id="detail"></div><div class="actions"><button id="reset" class="danger">Reset port</button><button id="disconnect">Disconnect clients</button><button id="clear">Clear events</button></div><div class="heading"><h2>Event log</h2><label><input type="checkbox" id="all-ports"> All ports</label></div><label><input type="checkbox" id="autoscroll" checked> Auto-scroll</label><div id="logs" class="logs" aria-live="off"></div></section></div></main><script src="/static/dashboard.js" defer></script></body></html>
