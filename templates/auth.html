<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ 'Set password' if setup else 'Sign in' }}</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth"><main class="auth-card"><h1>{{ 'Set administrator password' if setup else 'Sign in' }}</h1>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{csrf}}">{% if setup %}<label>One-time setup code<input name="token" required autocomplete="off"></label><p class="hint">Read the code from <code>{{code_path}}</code> on the server. It is deleted after setup.</p>{% endif %}<label>{{ 'Password (12+ characters)' if setup else 'Administrator password' }}<input type="password" name="password" required minlength="{{12 if setup else 1}}" autocomplete="{{'new-password' if setup else 'current-password'}}"></label><button class="primary">{{'Save password' if setup else 'Sign in'}}</button></form></main></body></html>
